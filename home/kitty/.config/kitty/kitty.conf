include themes/tokyo_night_moon.conf

# ------------------------------------------------
# Appearance / Window
# ------------------------------------------------
initial_window_width 90c
initial_window_height 28c
window_padding_width 8
background_opacity 0.75

# macOS / Wayland では blur 有効
background_blur 1

# タイトルにカレントディレクトリ表示
window_title_format "{cwd}"

# ------------------------------------------------
# Font
# ------------------------------------------------
font_family HackGen Console NF
font_size 12.0

# リガチャ無効（好みで）
disable_ligatures never

# ------------------------------------------------
# Scrolling
# ------------------------------------------------
scrollback_lines 10000

# ------------------------------------------------
# Clipboard / Selection
# ------------------------------------------------
copy_on_select yes
enable_audio_bell no

# Wayland / Linux での clipboard 安定化
clipboard_control write-clipboard write-primary read-clipboard-ask

# ------------------------------------------------
# Mouse
# ------------------------------------------------
hide_mouse_when_typing yes

# ------------------------------------------------
# Performance（重要）
# ------------------------------------------------
# GPUレンダリング最適化
repaint_delay 10
input_delay 3
sync_to_monitor yes

# ------------------------------------------------
# Keyboard
# ------------------------------------------------
map f11 toggle_fullscreen

# タブ操作
map ctrl+shift+t new_tab
map ctrl+shift+w close_tab
map ctrl+tab next_tab
map ctrl+shift+tab previous_tab

# ウィンドウ分割
# map ctrl+shift+enter launch --location=hsplit
# map ctrl+shift+v launch --location=vsplit

# ------------------------------------------------
# Shell integration
# ------------------------------------------------
shell_integration enabled

# ------------------------------------------------
# Cursor
# ------------------------------------------------
cursor_shape block
cursor_blink_interval 0.5


# BEGIN_KITTY_THEME
# Noctalia
include current-theme.conf
# END_KITTY_THEME
